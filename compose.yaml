name: browser-transport

services:
  gluetun:
    # Pinned by tag AND digest so a compromised/retagged upstream image can't slip in.
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: browser-transport-gluetun
    cap_add:
      - NET_ADMIN # required to create the tunnel and manage the kill-switch firewall
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback only: binding to 0.0.0.0 would expose an open proxy to your LAN.
      - "127.0.0.1:8888:8888/tcp"
    volumes:
      - ./wg0.conf:/gluetun/wireguard/wg0.conf:ro
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      HTTPPROXY: "on"
      HTTPPROXY_STEALTH: "on" # don't add Via / X-Forwarded-For headers
      HTTPPROXY_LOG: "off" # don't log browsing destinations
      # DNS: plain DNS to the resolver from wg0.conf's `DNS =` line (Proton: 10.2.0.1),
      # reachable only inside the tunnel. WG_DNS is parsed and exported by ./bt.
      DNS_UPSTREAM_RESOLVER_TYPE: plain
      DNS_UPSTREAM_PLAIN_ADDRESSES: ${WG_DNS:?start via ./bt}:53
    restart: unless-stopped
